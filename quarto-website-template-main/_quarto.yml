# From www.marvinschmitt.com

# website settings
website:
  title: "Christopher Blake Smiley"
  favicon: img/flower_favicon.png
  image: img/cover_image.jpg
  
  # start of the navigation bar 
  navbar:
    background: "#980000ff"
    pinned: true
    logo: /img/flower_favicon.png
    
    # sub-pages
    left:
      - text: "Projects"
        href: projects/index.qmd
      - text: "Gallery"
        href: gallery/index.qmd
      - text: "CV"
        href: cv/index.qmd
    
    # social media handles
    right:
      - icon: envelope
        aria-label: email
        href: "mailto:c.blakesmiley@gmail.com"  

# Don't touch unless you know what you are doing :) ------------
  search: 
    location: navbar
    type: textbox
  page-footer: 
    left: |
      <span class="faux-block">&#169; 2023 Marvin Schmitt CC BY-SA 4.0</span>
    center: |
      <span class="faux-block"><a href="https://www.marvinschmitt.com/blog/website-tutorial-quarto/">View the tutorial for this template!</a></span>
    right: "Last updated: {{< meta date >}}"

project:
  type: website
  output-dir: docs

  preview: 
    port: 22222
    browser: true
    watch-inputs: true
    navigate: true

execute:
  freeze: true

format:
  html:
    date-format: "MMMM YYYY"
    fontsize: 1.1em
    theme: 
      - pulse
      - html/styles.scss
    toc: false
    code-link: true
    anchor-sections: true
    fig-cap-location: margin
    reference-location: margin
    footnotes-hover: true